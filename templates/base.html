<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendU – Personal Spending Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts: Satisfy for the logo, Quicksand for everything else -->
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================================
           DESIGN TOKENS — shared across every page
           Sage + leaf print theme: earthy background, peach cream
           cards, taupe accents, blue-gray text.
           ========================================================= */
        :root {
            --bg-sage:     #A3B18A;
            --leaf:        #C5D2B2;
            --card-bg:     #f7e6d5;
            --accent:      #826B5C;
            --terracotta:  #B06A5B;
            --text-main:   #4F5148;
            --text-muted2: #77796F;
            --logo-tile:   #899ABE;
            --logo-letter: #ECE3DF;
            --wordmark:    #F8EDEB;

            /* Legacy names still referenced by page styles — mapped
               onto the new palette so nothing renders unstyled. */
            --bg-deep:    #A3B18A;
            --bg-mid:     #A3B18A;
            --accent-violet: #8E7766;
            --accent-cyan:   #8E7766;
            --accent-coral:  #B06A5B;
            --text-soft:  #53566B;
            --text-bright: #53566B;
            --glass: #FFE8D6;
            --glass-border: rgba(142, 119, 102, 0.25);
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        /* =========================================================
           STATIC BACKGROUND
           Solid sage wall with sponge-painted leaf prints layered
           on top (see .leaf-bg). Static so it never repaints.
           ========================================================= */
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-sage);
            font-family: 'Quicksand', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        /* Sponge-painted leaf prints — tiled SVG served from static/
           (same-origin, cached after first load). Fixed attachment so
           it never repaints on scroll; tiled to cover any viewport. */
        .leaf-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image: url("{{ url_for('static', filename='leaves.svg') }}");
            background-size: 700px 700px;
            background-repeat: repeat;
            background-attachment: fixed;
        }

        /* =========================================================
           LAYOUT
           ========================================================= */
        .container {
            max-width: 1200px;
            margin-top: 50px;
            margin-bottom: 60px;
            padding: 30px;
            border-radius: 22px;
            background: rgba(255, 248, 240, 0.30);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(142, 119, 102, 0.18);
            box-shadow: 0 6px 30px rgba(83, 86, 107, 0.14);
            animation: containerIn 0.5s ease both;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================
           SHARED COMPONENTS
           ========================================================= */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(142, 119, 102, 0.22);
            box-shadow: 0 4px 18px rgba(83, 86, 107, 0.14);
            color: var(--text-main);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 26px rgba(83, 86, 107, 0.20);
        }

        .ai-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 18px rgba(83, 86, 107, 0.14);
            border-radius: var(--radius-lg);
            color: var(--text-main);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            color: var(--text-main);
        }

        /* Buttons — tech-modern by default, with a soft press/hover lift */
        .btn {
            border-radius: 22px !important;
            font-weight: 600;
            max-width: 400px;
            transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: var(--wordmark);
            border: none;
            box-shadow: 0 3px 12px rgba(83, 86, 107, 0.20);
        }
        .btn-primary:hover {
            background: #7C6656;
            color: var(--wordmark);
            box-shadow: 0 5px 16px rgba(83, 86, 107, 0.28);
        }

        .btn-outline-dark {
            border: 2px solid var(--accent);
            color: var(--accent) !important;
            background: transparent;
        }
        .btn-outline-dark:hover {
            background: var(--accent);
            color: var(--card-bg) !important;
        }

        /* Focus states for accessibility — visible taupe ring */
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Scrollbar theming (webkit) */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(163, 177, 138, 0.4); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 768px) {
            .container {
                margin-top: 20px;
                padding: 18px;
                border-radius: 16px;
            }
            .btn { width: 100% !important; max-width: none; }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>

    <div class="leaf-bg"></div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

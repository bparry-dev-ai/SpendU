{% extends 'base.html' %}
{% block content %}

<style>
    /* ===== SpendU Logo ===== */
    .logo-container {
        margin-top: 30px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        animation: fadeDown 0.6s ease both;
    }

    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-12px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .logo-icon {
        width: 90px;
        height: 90px;
        background: var(--logo-tile);
        border-radius: 22px;
        box-shadow: 0 4px 16px rgba(83, 86, 107, 0.25);
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 52px;
        font-family: 'Satisfy', cursive;
        color: var(--logo-letter);
        border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .logo-text {
        font-size: 56px;
        font-family: 'Satisfy', cursive;
        line-height: 1;
        color: var(--wordmark);
        text-shadow: 0 2px 8px rgba(83, 86, 107, 0.25);
    }

    /* ===== Date / Time ===== */
    .datetime-block {
        text-align: center;
        margin-bottom: 2.5rem;
        animation: fadeDown 0.6s 0.1s ease both;
        color: var(--text-main);
    }
    .datetime-block h4 {
        font-weight: 400;
        opacity: 0.85;
    }

    /* ===== Spend Summary Card ===== */
    .spend-summary {
        animation: fadeUp 0.6s 0.15s ease both;
        position: relative;
        overflow: hidden;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .spend-amount {
        color: var(--text-main);
        font-family: 'Quicksand', sans-serif;
        font-weight: 700;
    }

    .spend-summary .card-title {
        color: var(--text-muted2);
        font-weight: 500;
    }

    .family-divider {
        border: none;
        border-top: 1px solid rgba(142, 119, 102, 0.35);
        width: 60%;
        margin: 14px auto;
        opacity: 1;
    }

    .family-amount {
        font-weight: 600;
    }

    /* ===== Action Buttons ===== */
    .action-row {
        animation: fadeUp 0.6s 0.25s ease both;
    }
    .btn-primary, .btn-outline-dark {
        width: 260px;
        border-radius: var(--radius-md) !important;
    }

    @media (max-width: 576px) {
        .btn-primary, .btn-outline-dark { width: 100%; }
    }
</style>

<!-- ===== SpendU Logo + Branding ===== -->
<div class="logo-container">
    <div class="logo-icon">S</div>
    <div class="logo-text">SpendU</div>
</div>

<!-- ===== Date + Time ===== -->
<div class="datetime-block">
    <h3>{{ date }}</h3>
    <h4>{{ time }}</h4>
</div>

<!-- ===== Spending Summary ===== -->
<div class="card p-4 mb-4 text-center ai-card spend-summary">
    <h5 class="card-title">{{ username | capitalize }}'s spending for {{ wkbegin }} - {{ wkend }}</h5>
    <h1 class="display-4 spend-amount">$<span class="count-up" data-target="{{ spent }}">0.00</span></h1>
    <hr class="family-divider">
    <h6 class="card-title mb-1">Family total</h6>
    <h3 class="spend-amount family-amount">$<span class="count-up" data-target="{{ family_spent }}">0.00</span></h3>
</div>

<!-- ===== Buttons ===== -->
<div class="d-flex flex-wrap justify-content-center gap-3 action-row">
    <a href="{{ url_for('add_transaction') }}" class="btn btn-primary">➕ Add Transaction</a>
    <a href="{{ url_for('analytics') }}" class="btn btn-outline-dark">📊 View Analytics</a>
</div>

<!-- ===== Passkey enrollment + Logout ===== -->
<div class="d-flex flex-wrap justify-content-center gap-3 mt-4 action-row">
    <button id="addPasskeyBtn" type="button" class="btn btn-outline-dark btn-sm d-none" style="width: auto;">
        📱 Add Face ID / Passkey
    </button>
    <form method="post" action="{{ url_for('logout') }}" class="d-inline">
        <button type="submit" class="btn btn-outline-dark btn-sm" style="width: auto;">🔒 Log Out</button>
    </form>
</div>
<div id="passkeyMsg" class="text-center mt-2" style="display: none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@simplewebauthn/browser@10.0.0/dist/bundle/index.umd.min.js"></script>
<script>
    // Passkey enrollment — only shown on browsers that support WebAuthn
    (function () {
        if (!window.SimpleWebAuthnBrowser || !SimpleWebAuthnBrowser.browserSupportsWebAuthn()) return;
        const btn = document.getElementById('addPasskeyBtn');
        btn.classList.remove('d-none');

        btn.addEventListener('click', async function () {
            const msg = document.getElementById('passkeyMsg');
            msg.style.display = 'none';

            function show(text, ok) {
                msg.textContent = text;
                msg.style.color = ok ? 'var(--accent-cyan)' : 'var(--accent-coral)';
                msg.style.display = 'block';
            }

            try {
                const options = await fetch("{{ url_for('passkey_register_begin') }}", { method: 'POST' })
                    .then(r => r.json());
                const attestation = await SimpleWebAuthnBrowser.startRegistration(options);
                const result = await fetch("{{ url_for('passkey_register_complete') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(attestation),
                }).then(r => r.json());
                if (result.ok) {
                    show('✅ Face ID added — you can use it on the sign-in screen from now on.', true);
                    return;
                }
                throw new Error(result.error || 'Registration failed.');
            } catch (e) {
                if (e.name === 'NotAllowedError') return; // user cancelled the prompt
                if (e.name === 'InvalidStateError') {
                    show('This device already has a passkey for SpendU.', true);
                    return;
                }
                show(e.message || 'Could not add Face ID on this device.', false);
            }
        });
    })();
</script>

<script>
    // Animated count-up for the weekly spend totals (yours + family)
    (function () {
        document.querySelectorAll('.count-up').forEach(function (el) {
            const target = parseFloat(el.dataset.target) || 0;
            const duration = 900; // ms
            const start = performance.now();

            function tick(now) {
                const progress = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease-out-cubic
                el.textContent = (target * eased).toFixed(2);
                if (progress < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        });
    })();
</script>

{% endblock %}
